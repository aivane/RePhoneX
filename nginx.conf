server {
    # Listen on port 80 for all IP addresses
    listen 80 default_server;
    listen [::]:80 default_server;

    # Catch-all server name since you are using an IP address instead of a domain
    server_name _;

    # IMPORTANT: Ensure this path matches the folder where you copied the 'dist' folder on the VM
    root /var/www/rephonex/dist;
    
    # The default file to serve
    index index.html;

    # Gzip Compression (Optimizes loading speed)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Core routing logic for Vue SPA (History Mode Fallback)
    location / {
        # 1. Try serving the exact file requested
        # 2. Try serving it as a directory
        # 3. Fallback to index.html so Vue Router can handle the URL
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (CSS, JS, Images) to improve performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
}
